services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - portal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: blueashdigital-tech-backend:${DEPLOYMENT_VERSION:?DEPLOYMENT_VERSION must be a full release commit SHA}
    restart: unless-stopped
    build:
      context: ./backend
      args:
        DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION}
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_NAME: ${APP_NAME:-Blue Ash Digital Portal}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://blueashdigital.tech,https://www.blueashdigital.tech}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?EMAIL_ENCRYPTION_KEY is required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-blueash_portal_session}
      PRE_AUTH_COOKIE_NAME: ${PRE_AUTH_COOKIE_NAME:-__Host-blueash_pre_auth}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      OPPORTUNITY_RADAR_CLIENT_ID: ${OPPORTUNITY_RADAR_CLIENT_ID:-opportunity-radar}
      OPPORTUNITY_RADAR_CLIENT_SECRET: ${OPPORTUNITY_RADAR_CLIENT_SECRET:?OPPORTUNITY_RADAR_CLIENT_SECRET is required}
      OPPORTUNITY_RADAR_PUBLIC_ORIGIN: ${OPPORTUNITY_RADAR_PUBLIC_ORIGIN:-https://radar.blueashdigital.tech}
      OPPORTUNITY_RADAR_CALLBACK_URI: ${OPPORTUNITY_RADAR_CALLBACK_URI:-https://radar.blueashdigital.tech/api/auth/callback}
      APPLICATION_AUTH_CODE_TTL_SECONDS: ${APPLICATION_AUTH_CODE_TTL_SECONDS:-60}
      APPLICATION_SESSION_IDLE_SECONDS: ${APPLICATION_SESSION_IDLE_SECONDS:-1800}
      APPLICATION_SESSION_ABSOLUTE_MAX_SECONDS: ${APPLICATION_SESSION_ABSOLUTE_MAX_SECONDS:-28800}
      APPLICATION_AUTH_CLEANUP_RETENTION_SECONDS: ${APPLICATION_AUTH_CLEANUP_RETENTION_SECONDS:-86400}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - portal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: nickr4408/blueashdigital-tech-frontend:9eb0da3b0c5c6fa12c127d6d7348e20b9b3c6108
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - portal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  portal:
    driver: bridge
