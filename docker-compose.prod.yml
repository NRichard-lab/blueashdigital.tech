services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portal-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portal-internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.blueash-api.rule=Host(`api.blueashdigital.tech`)
      - traefik.http.routers.blueash-api.entrypoints=websecure
      - traefik.http.routers.blueash-api.tls.certresolver=letsencrypt
      - traefik.http.services.blueash-api.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.blueashdigital.tech
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.blueash.rule=Host(`blueashdigital.tech`) || Host(`www.blueashdigital.tech`)
      - traefik.http.routers.blueash.entrypoints=websecure
      - traefik.http.routers.blueash.tls.certresolver=letsencrypt
      - traefik.http.services.blueash.loadbalancer.server.port=80

volumes:
  postgres_data:

networks:
  portal-internal:
    driver: bridge
  traefik-public:
    external: true

